name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Format & Clippy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Clippy (Windows code paths)
        run: cargo clippy --locked --all-targets --target x86_64-pc-windows-msvc -- -D warnings

  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-24.04 }
          - { name: linux-aarch64, os: ubuntu-24.04-arm }
          - { name: macos-aarch64, os: macos-15 }
          - { name: macos-x86_64, os: macos-15-intel }
          - { name: windows-x86_64, os: windows-2025 }
          - { name: windows-aarch64, os: windows-11-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --locked
      - name: Smoke test
        shell: bash
        run: |
          cargo run --locked -q -- --version
          cargo run --locked -q -- completions bash > /dev/null

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --locked --all-targets

  install-script:
    name: install.sh lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck --shell=sh install.sh

  install-ps1:
    name: install.ps1 (PowerShell ${{ matrix.ps }})
    runs-on: windows-2025
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ps: "5.1", shell: powershell }
          - { ps: "7", shell: pwsh }
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      TARGET: x86_64-pc-windows-msvc
      GG_BASE_URL: http://127.0.0.1:8765
      GG_INSTALL_DIR: ${{ github.workspace }}\gg-bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --locked
      - name: Package a release archive like release.yml and serve it on localhost
        shell: pwsh
        run: |
          $name = "gg-$env:TARGET"
          New-Item -ItemType Directory -Force "dist/$name/completions" | Out-Null
          Copy-Item target/debug/gg.exe, LICENSE, README.md "dist/$name/"
          target/debug/gg.exe completions powershell > "dist/$name/completions/gg.ps1"
          & "$env:SystemRoot\System32\tar.exe" -a -c -f "dist/$name.zip" -C dist $name
          $hash = (Get-FileHash -Algorithm SHA256 "dist/$name.zip").Hash.ToLowerInvariant()
          Set-Content -NoNewline -Encoding ascii "dist/$name.zip.sha256" "$hash *$name.zip`n"
          Start-Process python -ArgumentList '-m', 'http.server', '8765', '--bind', '127.0.0.1', '--directory', 'dist'
          Start-Sleep -Seconds 2
      - name: Install with irm | iex, then again over the existing install
        run: |
          $PSVersionTable.PSVersion.ToString()
          Get-Content -Raw install.ps1 | Invoke-Expression
          Get-Content -Raw install.ps1 | Invoke-Expression
          $exe = (Get-Command gg -ErrorAction Stop).Source
          if ($exe -ne (Join-Path $env:GG_INSTALL_DIR 'gg.exe')) { throw "gg resolved to $exe" }
          if (Test-Path (Join-Path $env:GG_INSTALL_DIR 'gg.exe.old')) { throw 'gg.exe.old left behind' }
          gg --version
          if ($LASTEXITCODE -ne 0) { throw 'gg --version failed' }
      - name: Tampered archive is rejected
        run: |
          $sum = "dist/gg-$env:TARGET.zip.sha256"
          Set-Content -NoNewline -Encoding ascii $sum ('0' * 64 + " *gg-$env:TARGET.zip`n")
          $failed = $false
          try { Get-Content -Raw install.ps1 | Invoke-Expression } catch { $failed = $_.Exception.Message -like '*checksum mismatch*' }
          if (-not $failed) { throw 'install.ps1 accepted a bad checksum' }
      - name: Use gg and its tab completion
        run: |
          $env:Path = "$env:GG_INSTALL_DIR;$env:Path"
          $env:GG_CONFIG = Join-Path $env:RUNNER_TEMP 'gg-config.toml'
          gg profile add personal --author 'Jane Doe' --email jane@example.com --username octocat
          if ($LASTEXITCODE -ne 0) { throw 'gg profile add failed' }
          $list = gg profile list | Out-String
          if ($list -notmatch 'personal') { throw "unexpected: $list" }
          gg completions powershell | Out-String | Invoke-Expression
          $found = (TabExpansion2 -inputScript 'gg prof' -cursorColumn 7).CompletionMatches.CompletionText
          if ($found -notcontains 'profile') { throw "completion returned: $found" }
