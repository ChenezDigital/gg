# Builds static Linux (musl), macOS and Windows binaries for x86_64 and aarch64 when a version tag is pushed,
# attaches them to a GitHub release with SHA-256 checksums and signed build-provenance attestations.
#
#   git tag v0.2.0 && git push origin v0.2.0
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Check version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag must match Cargo.toml
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version $version"
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write # build-provenance attestation (Sigstore)
      attestations: write
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: aarch64-apple-darwin, os: macos-15 }
          - { target: x86_64-pc-windows-msvc, os: windows-2025 }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - name: Test
        run: cargo test --locked --target "$TARGET"
        env:
          TARGET: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target "$TARGET"
        env:
          TARGET: ${{ matrix.target }}
      - name: Package
        id: package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          exe="" ext=tar.gz
          case "$TARGET" in *-windows-*) exe=.exe ext=zip ;; esac
          bin="target/$TARGET/release/gg$exe"
          "$bin" --version
          name="gg-$TARGET"
          mkdir -p "dist/$name/completions"
          cp "$bin" LICENSE README.md "dist/$name/"
          "$bin" completions bash > "dist/$name/completions/gg.bash"
          "$bin" completions zsh > "dist/$name/completions/_gg"
          "$bin" completions fish > "dist/$name/completions/gg.fish"
          "$bin" completions powershell > "dist/$name/completions/gg.ps1"
          if [ "$ext" = zip ]; then
            # Windows' own bsdtar writes a standard zip that Expand-Archive and tar.exe both read.
            systar="$(cygpath -u "${SYSTEMROOT:-C:\\Windows}")/System32/tar.exe"
            (cd dist && "$systar" -a -cf "$name.zip" "$name")
          else
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          fi
          echo "archive=$name.$ext" >> "$GITHUB_OUTPUT"
      - name: Checksum
        working-directory: dist
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          if command -v sha256sum >/dev/null; then sha256sum "$ARCHIVE"; else shasum -a 256 "$ARCHIVE"; fi > "$ARCHIVE.sha256"
          cat "$ARCHIVE.sha256"
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/${{ steps.package.outputs.archive }}
      - name: Keep the signed attestation bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: cp "$BUNDLE" "dist/$ARCHIVE.sigstore.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gg-${{ matrix.target }}
          path: |
            dist/${{ steps.package.outputs.archive }}
            dist/${{ steps.package.outputs.archive }}.sha256
            dist/${{ steps.package.outputs.archive }}.sigstore.json
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gg-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          cat ./*.tar.gz.sha256 ./*.zip.sha256 > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" dist/* --verify-tag --generate-notes --title "gg $TAG" $prerelease
